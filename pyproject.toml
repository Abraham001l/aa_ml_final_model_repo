[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aa-route-recovery"
version = "1.0.0"
description = "Reproducible, interpretable 24-month directional airline-market forecasting"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3", "pandas>=2.1,<3"]

[project.optional-dependencies]
plots = ["matplotlib>=3.8,<4"]

[project.scripts]
aa-forecast = "route_recovery.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
